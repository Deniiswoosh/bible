{% extends "base.html" %}

{% block title %}Create Platform User{% endblock %}

{% block body %}
<main class="min-h-screen bg-slate-50 px-6 py-10">
    <section class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <a href="{{ url_for('super_admin.dashboard') }}" class="text-sm font-semibold text-blue-600 hover:text-blue-700">Back to platform administration</a>
        <h1 class="mt-5 text-2xl font-bold text-slate-900">Create a user</h1>
        <form method="post" class="mt-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input name="name" required placeholder="Full name" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm">
            <input name="email" type="email" required placeholder="Email address" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm">
            <input name="password" type="password" required placeholder="Temporary password" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm">
            <select name="group_id" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm">
                <option value="">Select a group</option>
                {% for group in groups %}<option value="{{ group.id }}">{{ group.name }}</option>{% endfor %}
            </select>
            <select name="role" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm">
                <option value="Admin">Admin</option>
                <option value="Member">Member</option>
            </select>
            <button class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Create user</button>
        </form>
    </section>
</main>
{% endblock %}
