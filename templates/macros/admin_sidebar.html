{% macro render_admin_sidebar(active_page) %}
<aside class="w-full md:w-64 bg-[#0f172a] text-slate-300 flex flex-col justify-between flex-shrink-0 md:min-h-screen">
    <div>
        <div class="p-4 md:p-6 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3v13.55a2.5 2.5 0 0 0 2.45 2.45h7.05V5a2 2 0 0 0-2-2H12zM2.5 5v14h7.05A2.45 2.45 0 0 0 12 16.55V3H4.5a2 2 0 0 0-2 2z"/>
                        <path d="M11 5.5h2v3h3v2h-3v5h-2v-5H8v-2h3v-3z" fill="#ffffff" />
                    </svg>
                </div>
                <div class="leading-tight">
                    <span class="font-bold text-white tracking-tight block">Bible</span>
                    <span class="font-medium text-slate-300 text-xs tracking-tight block">Accountability</span>
                </div>
            </div>
            <button type="button" class="md:hidden rounded-lg p-2 text-slate-300 hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Toggle navigation" aria-expanded="false" aria-controls="admin-mobile-menu" data-admin-menu-toggle>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>

        <div id="admin-mobile-menu" class="hidden md:flex md:flex-col md:justify-between md:flex-grow">
            <nav class="px-4 space-y-1.5 mt-2 pb-4 md:pb-0">
                <a href="{{ url_for('admin.dashboard') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm {% if active_page == 'dashboard' %}text-white bg-blue-600 shadow-md shadow-blue-600/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %} transition-all">
                    <svg class="w-5 h-5 {% if active_page == 'dashboard' %}text-white{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('admin.members') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm {% if active_page == 'members' %}text-white bg-blue-600 shadow-md shadow-blue-600/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %} transition-all">
                    <svg class="w-5 h-5 {% if active_page == 'members' %}text-white{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span>Members</span>
                </a>
            </nav>

            <div class="p-4 border-t border-slate-800/80">
                <a href="{{ url_for('auth.logout') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-400 hover:text-rose-400 hover:bg-rose-950/30 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </div>
</aside>
{% endmacro %}
